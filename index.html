<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Virtual Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Personal Library</h1>
    <button id="new-book-btn">+ Add New Book</button>
  </header>

  <main>
    <!-- Dynamic grid containers where JavaScript builds card instances -->
    <div id="library-container" class="library-grid"></div>
  </main>

  <!-- Modal Form Dialog Component -->
  <dialog id="book-dialog">
    <form id="book-form" method="dialog" novalidate>
      <h2>Enter Book Details</h2>
      
      <div class="form-control">
        <label for="title">Book Title:</label>
        <input type="text" id="title" required placeholder="e.g. The Hobbit">
        <span class="error" aria-live="polite"></span>
      </div>

      <div class="form-control">
        <label for="author">Author:</label>
        <input type="text" id="author" required placeholder="e.g. J.R.R. Tolkien">
        <span class="error" aria-live="polite"></span>
      </div>

      <div class="form-control">
        <label for="pages">Number of Pages:</label>
        <input type="number" id="pages" required min="1" placeholder="310">
        <span class="error" aria-live="polite"></span>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="isRead">
        <label for="isRead">Have you read this book?</label>
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" id="submit-btn">Add to Collection</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
